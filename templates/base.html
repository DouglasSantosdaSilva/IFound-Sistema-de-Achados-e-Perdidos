{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}iFound - Achados e Perdidos{% endblock %}</title>
    
    <!-- Ícones do Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- CSS Estático do Projeto -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- Cabeçalho / Navbar -->
    <header class="navbar">
        <a href="{% url 'index' %}" class="navbar-brand">iFound - Achados e perdidos</a>
        <nav>
            <ul class="navbar-nav">
                <li>
                    <a href="{% url 'index' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                        Página Inicial
                    </a>
                </li>
                <li>
                    <a href="{% url 'meus_itens' %}" class="{% if request.resolver_match.url_name == 'meus_itens' %}active{% endif %}">
                        Meus Itens
                    </a>
                </li>
                <li>
                    <a href="{% url 'cadastrar_item' %}" class="{% if request.resolver_match.url_name == 'cadastrar_item' %}active{% endif %}">
                        Cadastro de itens
                    </a>
                </li>
                <li>
                    <!-- Botão de Perfil -->
                    <a href="{% url 'perfil' %}" class="profile-btn" title="Meu Perfil">
                        <i class="bi bi-person-circle"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo Específico de Cada Página -->
    {% block content %}
    {% endblock %}

</body>
</html>
