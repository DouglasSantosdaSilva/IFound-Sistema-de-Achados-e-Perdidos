{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Found - Achados e Perdidos{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function getCsrfHeaders(extraHeaders = {}) {
            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || getCookie('csrftoken');
            return {
                ...extraHeaders,
                'X-CSRFToken': csrfToken,
                'X-Requested-With': 'XMLHttpRequest'
            };
        }
    </script>
</head>
<body>
    <header class="navbar navbar-modern">
        <div class="navbar-container">
            <div class="navbar-brand-section">
                <a href="{% url 'index' %}" class="navbar-brand">
                    <span class="navbar-logo">IFound</span>
                    <span class="navbar-subtitle">Achados e Perdidos</span>
                </a>
            </div>
            <nav class="navbar-nav-wrap" aria-label="Menu principal">
                <ul class="navbar-nav">
                    <li>
                        <a href="{% url 'index' %}" class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}">
                            Página Inicial
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'meus_itens' %}" class="nav-link {% if request.resolver_match.url_name == 'meus_itens' %}active{% endif %}">
                            Meus Itens
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'cadastrar_item' %}" class="nav-link {% if request.resolver_match.url_name == 'cadastrar_item' %}active{% endif %}">
                            Cadastrar Item
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'perfil' %}" class="navbar-profile-btn" title="Meu Perfil" aria-label="Meu perfil">
                            <i class="bi bi-person-circle"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    {% block content %}
    {% endblock %}
</body>
</html>
